<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recording Console</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;600;700&display=swap");

      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --text: #111827;
        --muted: #64748b;
        --brand: #0f766e;
        --brand-2: #0ea5e9;
        --danger: #dc2626;
        --ok: #15803d;
        --warn: #d97706;
        --border: #dbe4ee;
        --shadow: 0 14px 40px rgba(15, 23, 42, 0.09);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", "Manrope", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 20%, rgba(14, 165, 233, 0.15), transparent 35%),
          radial-gradient(circle at 90% 0%, rgba(15, 118, 110, 0.16), transparent 30%),
          var(--bg);
      }

      .wrap {
        max-width: 1200px;
        margin: 28px auto 44px;
        padding: 0 18px;
      }

      .hero {
        background: linear-gradient(135deg, #082f49, #0f766e);
        color: #f8fafc;
        border-radius: 18px;
        padding: 22px 24px;
        box-shadow: var(--shadow);
      }

      .hero h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.2px;
      }

      .hero p {
        margin: 8px 0 0;
        color: #e2e8f0;
      }

      .grid {
        margin-top: 18px;
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 16px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .card h2 {
        font-size: 16px;
        margin: 0;
        padding: 16px 16px 0;
      }

      .card .inner {
        padding: 12px 16px 16px;
      }

      .form-row {
        margin-bottom: 10px;
      }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 5px;
      }

      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 9px 11px;
        outline: none;
        font-size: 14px;
      }

      input:focus {
        border-color: var(--brand-2);
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.18);
      }

      .btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 9px 14px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.12s ease;
      }

      button:hover {
        transform: translateY(-1px);
        opacity: 0.95;
      }

      .primary {
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
      }

      .muted {
        background: #334155;
      }

      .danger {
        background: var(--danger);
      }

      .status {
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
        min-height: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      thead th {
        text-align: left;
        color: #475569;
        border-bottom: 1px solid var(--border);
        padding: 10px 8px;
      }

      tbody td {
        border-bottom: 1px solid #ecf2f8;
        padding: 10px 8px;
        vertical-align: top;
      }

      .pill {
        display: inline-block;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 11px;
        font-weight: 700;
      }

      .pill-running { background: #dcfce7; color: var(--ok); }
      .pill-stopped { background: #fee2e2; color: #b91c1c; }
      .pill-error { background: #ffedd5; color: var(--warn); }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }

      .actions {
        display: flex;
        gap: 6px;
      }

      .actions button {
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 12px;
      }

      @media (max-width: 980px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="hero">
        <h1>Recording Service Console</h1>
        <p>添加流、启停控制、状态总览，自动刷新每 5 秒。</p>
      </section>

      <div class="grid">
        <section class="card">
          <h2>添加流</h2>
          <div class="inner">
            <div class="form-row">
              <label for="streamId">Stream ID</label>
              <input id="streamId" placeholder="camera_01" />
            </div>
            <div class="form-row">
              <label for="streamUrl">RTSP URL</label>
              <input id="streamUrl" placeholder="rtsp://..." />
            </div>
            <div class="form-row">
              <label for="outputDir">Output Dir</label>
              <input id="outputDir" placeholder="/data/recordings/camera_01" />
            </div>
            <div class="btns">
              <button id="startBtn" class="primary">启动流</button>
              <button id="refreshBtn" class="muted">立即刷新</button>
            </div>
            <div id="message" class="status"></div>
          </div>
        </section>

        <section class="card">
          <h2>流列表</h2>
          <div class="inner">
            <table>
              <thead>
                <tr>
                  <th>Stream</th>
                  <th>Status</th>
                  <th>Restarts</th>
                  <th>Node</th>
                  <th>URL</th>
                  <th>Output</th>
                  <th>Updated</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      const streamIdEl = $("streamId");
      const streamUrlEl = $("streamUrl");
      const outputDirEl = $("outputDir");
      const rowsEl = $("rows");
      const messageEl = $("message");

      function setMessage(msg, isError = false) {
        messageEl.style.color = isError ? "#b91c1c" : "#0f766e";
        messageEl.textContent = msg;
      }

      function statusClass(status, alive) {
        if (status === "RUNNING" && alive) return "pill pill-running";
        if (status === "STOPPED") return "pill pill-stopped";
        return "pill pill-error";
      }

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;");
      }

      async function fetchJSON(url, options = {}) {
        const res = await fetch(url, options);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.detail || JSON.stringify(data) || `HTTP ${res.status}`);
        }
        return data;
      }

      async function refreshTable() {
        try {
          const [runtimeList, catalogList] = await Promise.all([
            fetchJSON("/streams/list"),
            fetchJSON("/streams/catalog"),
          ]);

          const runtimeMap = new Map(runtimeList.map((x) => [x.stream_id, x]));
          const merged = catalogList.map((x) => {
            const rt = runtimeMap.get(x.stream_id);
            return {
              stream_id: x.stream_id,
              status: rt?.status || x.status,
              alive: rt?.alive ?? false,
              restarts: rt?.restarts ?? 0,
              node_id: rt?.node_id || x.node_id,
              url: x.url,
              output_dir: x.output_dir,
              updated_at: x.updated_at,
            };
          });

          rowsEl.innerHTML = merged
            .map(
              (s) => `
                <tr>
                  <td class="mono">${escapeHtml(s.stream_id)}</td>
                  <td><span class="${statusClass(s.status, s.alive)}">${escapeHtml(s.status)}${s.alive ? "" : " (dead)"}</span></td>
                  <td>${s.restarts}</td>
                  <td>${escapeHtml(s.node_id)}</td>
                  <td class="mono">${escapeHtml(s.url)}</td>
                  <td class="mono">${escapeHtml(s.output_dir)}</td>
                  <td>${new Date(s.updated_at).toLocaleString()}</td>
                  <td>
                    <div class="actions">
                      <button class="primary" data-start="${escapeHtml(s.stream_id)}">启动</button>
                      <button class="danger" data-stop="${escapeHtml(s.stream_id)}">停止</button>
                    </div>
                  </td>
                </tr>
              `
            )
            .join("");
        } catch (err) {
          setMessage(`刷新失败: ${err.message}`, true);
        }
      }

      async function startStream(payload) {
        return fetchJSON("/streams/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
      }

      async function stopStream(streamId) {
        return fetchJSON("/streams/stop", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ stream_id: streamId }),
        });
      }

      $("startBtn").addEventListener("click", async () => {
        const stream_id = streamIdEl.value.trim();
        const url = streamUrlEl.value.trim();
        const output_dir = outputDirEl.value.trim();

        if (!stream_id || !url) {
          setMessage("请至少填写 Stream ID 和 URL。", true);
          return;
        }
        try {
          const res = await startStream({ stream_id, url, output_dir: output_dir || null });
          setMessage(`启动成功: ${res.stream_id} (${res.status})`);
          await refreshTable();
        } catch (err) {
          setMessage(`启动失败: ${err.message}`, true);
        }
      });

      $("refreshBtn").addEventListener("click", refreshTable);

      rowsEl.addEventListener("click", async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const startId = target.dataset.start;
        const stopId = target.dataset.stop;

        if (startId) {
          try {
            const catalog = await fetchJSON("/streams/catalog");
            const item = catalog.find((x) => x.stream_id === startId);
            if (!item) throw new Error("未找到 stream 配置");
            const res = await startStream({
              stream_id: item.stream_id,
              url: item.url,
              output_dir: item.output_dir,
            });
            setMessage(`启动成功: ${res.stream_id} (${res.status})`);
            await refreshTable();
          } catch (err) {
            setMessage(`启动失败: ${err.message}`, true);
          }
        }

        if (stopId) {
          try {
            const res = await stopStream(stopId);
            setMessage(`停止成功: ${res.stream_id} (${res.status})`);
            await refreshTable();
          } catch (err) {
            setMessage(`停止失败: ${err.message}`, true);
          }
        }
      });

      refreshTable();
      setInterval(refreshTable, 5000);
    </script>
  </body>
  </html>
